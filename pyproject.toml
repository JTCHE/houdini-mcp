[project]
name = "houdini-mcp-server"
version = "0.7.5"  # Raise .claude-plugin/plugin.json to match. Users get no update until it changes.
description = "Connect AI Agents to SideFX Houdini, with full documentation and screenshot support."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Chedeville" }]
keywords = ["houdini", "sidefx", "mcp", "model-context-protocol", "vfx", "3d"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=2.2",
    "houdinimd-docs>=0.1",
]

# The repository URL lives here. Everything that needs it reads it from here,
# except the bootstrap scripts, which run before the repository exists.
[project.urls]
Repository = "https://github.com/JTCHE/houdini-mcp"
Issues = "https://github.com/JTCHE/houdini-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/houdinimcp", "src/bridge"]

[tool.hatch.build.targets.sdist]
include = ["src", "houdini_mcp_server.py", "README.md",
           "LICENSE", "AGENTS.md", "guides", "bootstrap.sh", "bootstrap.bat"]

[project.scripts]
houdinimcp-bridge = "bridge.cli:main"
# `uvx houdini-mcp-server` runs the script with the name of the package. The
# MCP Registry starts the server that way.
houdini-mcp-server = "bridge.cli:main"
houdinimcp-install = "bridge.onboarding.install:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
