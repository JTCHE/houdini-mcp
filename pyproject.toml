[project]
name = "houdinimcp"
version = "0.1.0"
description = "MCP bridge connecting SideFX Houdini to Claude AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2",
]

# The repository URL lives here. Everything that needs it reads it from here,
# except the bootstrap scripts, which run before the repository exists.
[project.urls]
Repository = "https://github.com/JTCHE/houdini-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/houdinimcp", "src/bridge"]

# The docs tool reads this module, and it lives in the repository root until the
# documentation engine replaces it.
[tool.hatch.build.targets.wheel.force-include]
"houdini_docs.py" = "houdini_docs.py"

[project.scripts]
houdinimcp-bridge = "bridge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
