[project]
name = "houdinimcp"
version = "0.1.0"
description = "MCP bridge connecting SideFX Houdini to Claude AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.12",
]

# The repository URL lives here. Everything that needs it reads it from here,
# except the bootstrap scripts, which run before the repository exists.
[project.urls]
Repository = "https://github.com/JTCHE/houdini-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/houdinimcp"]

[project.scripts]
houdinimcp-bridge = "houdini_mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
